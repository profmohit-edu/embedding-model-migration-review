name: Publish and verify research evidence
on:
  push:
    paths:
      - ".github/workflows/publish-evidence.yml"
      - "code/constructed_checks.py"
      - "ESM_1_Embedding_Migration.zip"
      - "ESM_1_GitHub_Upload.zip"
      - "ESM_1.zip"
      - "supplement/ESM_1.zip"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Regenerate 5000 constructed checks
        run: |
          python3 code/constructed_checks.py > /tmp/constructed-checks.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          e=Path('evidence')
          d=json.loads((e/'constructed_results.json').read_text())
          cases=json.loads((e/'randomized_cases.json').read_text())
          assert len(cases)==5000
          assert d['randomized_checks']['certified_top3']==3338
          assert d['randomized_checks']['uncertified_top3_changes']==667
          assert d['randomized_checks']['violations']==0
          print('PASS: 5000 constructed checks; 3338 certified; zero violations')
          PY
      - name: Extract and validate uploaded evidence archive
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,hashlib
          possible=[pathlib.Path('ESM_1_GitHub_Upload.zip'),pathlib.Path('ESM_1_Embedding_Migration.zip'),pathlib.Path('ESM_1.zip'),pathlib.Path('supplement/ESM_1.zip')]
          sources=[p for p in possible if p.exists()]
          if sources:
              p=sources[0]
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  for name in z.namelist():
                      path=pathlib.PurePosixPath(name)
                      assert not path.is_absolute() and '..' not in path.parts
                      if name.startswith(('evidence/','code/')) and not name.endswith('/'):
                          dest=pathlib.Path(name)
                          dest.parent.mkdir(parents=True,exist_ok=True)
                          dest.write_bytes(z.read(name))
              pathlib.Path('supplement').mkdir(exist_ok=True)
              pathlib.Path('supplement/sha256.txt').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
              print('Full supplementary archive extracted from',p)
          else:
              print('Full supplementary archive not yet uploaded; only constructed records available.')
          PY
          if [ -f evidence/study_extraction.json ]; then python3 code/verify_supplement.py; fi
      - name: Publish browsable results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence code
          if [ -f supplement/sha256.txt ]; then git add supplement/sha256.txt; fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified research evidence and reproducibility results"
            git push
          fi
